services:
  postgres:
    image: postgres:16-alpine
    container_name: integ-ramery2-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  watcher:
    build: .
    container_name: integ-ramery2-watcher
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./out:/app/out
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    build: .
    container_name: integ-ramery2-streamlit
    env_file: .env
    working_dir: /app/src/restitution
    command: ["uv", "run", "--no-sync", "streamlit", "run", "app.py", "--server.address=0.0.0.0"]
    ports:
      - "8502:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
