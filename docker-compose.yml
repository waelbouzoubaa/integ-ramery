services:
  postgres:
    image: postgres:16-alpine
    container_name: integ-ramery2-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  watcher:
    build: .
    container_name: integ-ramery2-watcher
    env_file: .env
    environment:
      CERT_PRIVATE_KEY_PATH: /app/certs/private_key.pem
    volumes:
      - ./data:/app/data
      - ./out:/app/out
      - ./certs/ramery-prod.key:/app/certs/private_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    build: .
    container_name: integ-ramery2-streamlit
    env_file: .env
    working_dir: /app/src/restitution
    command: ["uv", "run", "--no-sync", "streamlit", "run", "app.py", "--server.address=0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - infra_networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_networks"
      - "traefik.http.routers.prix-unitaires.rule=Host(`prix-unitaires.${MAIN_DOMAIN}`)"
      - "traefik.http.routers.prix-unitaires.entrypoints=websecure"
      - "traefik.http.routers.prix-unitaires.tls.certresolver=letsencrypt"
      - "traefik.http.services.prix-unitaires.loadbalancer.server.port=8501"
      - "traefik.http.routers.prix-unitaires.middlewares=core-ipallowlist@docker"

volumes:
  postgres_data:

networks:
  default:
    name: integ-ramery-network
  infra_networks:
    external: true
